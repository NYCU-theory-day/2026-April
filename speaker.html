<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Speaker – NYCU Theory Day 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>



<body>

<div class="page-container">

<main>

  <section class="speakers-section">
    <!-- Speaker details are stored at speaker.js-->

    <!-- Category Tabs -->
    <div class="speaker-category-tabs" id="speaker-category-tabs"></div>

    <p class="speaker-note">* listed in alphabetical order.</p>
    
    <!-- Tabs -->
    <div class="speaker-tabs" id="speaker-tabs"></div>

    <!-- Speaker Content -->
    <div class="speaker-content">

      <!-- Photo -->
      <div class="speaker-photo">
        <img id="speaker-photo"
             src="https://via.placeholder.com/300x400"
             alt="Speaker Photo">
      </div>

      <!-- Details -->
      <div class="speaker-details">

        <h2 class="speaker-name" id="speaker-name">
          PLACEHOLDER NAME
        </h2>

        <div class="speaker-title" id="speaker-title">
          PLACEHOLDER TITLE
        </div>

        <div class="speaker-affiliation" id="speaker-affiliation">
          PLACEHOLDER AFFILIATION
        </div>

        <div class="speaker-expertise" id="speaker-expertise">
          PLACEHOLDER EXPERTISE
        </div>

        <div class="speaker-abstract-box" id="speaker-abstract-box">
          <div class="speaker-talk-title-row">
            <h3>Title</h3>
            <p id="speaker-talk-title">PLACEHOLDER TALKTITLE TEXT.</p>
          </div>
          <h3>Abstract</h3>
          <p id="speaker-abstract">
            PLACEHOLDER ABSTRACT TEXT.
          </p>
        </div>

      </div>
    </div>

  </section>

</main>


<footer>
  © 2026 NYCU Theory Day — Contact: <a href="mailto:organizers@example.com">organizers@example.com</a>
</footer>



<script src="load-header.js"></script>
<script src="load-hero.js"></script>
<script src="speaker.js"></script>
<script src="page-loader.js"></script>
<script src="banner.js"></script>




</div>

</body>

</html>
